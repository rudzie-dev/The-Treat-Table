    <!-- Cream from byte one, not just once the JS bundle mounts and injects
         its <style> tag - otherwise slow connections see a plain white
         flash before React ever paints. -->

         in parallel with everything else instead of waiting in line. -->
    <link rel="preload" as="image" href="/images/cinnamon-rolls-hero.webp" fetchpriority="high" />
